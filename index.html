<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Shop</title>
<style>
:root{--bg:#050505;--card:#121212;--text:#f5f5f5;--muted:#a3a3a3;--accent:#e11d2e;--price:#ff4d5a;--line:#2b2b2b;--glow:#e11d2e55;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at top,#2a0408 0,#050505 380px) fixed;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:14px;max-width:900px;margin:0 auto}
header b{font-size:22px;color:#fff;text-shadow:0 0 12px var(--accent)}
#hdr{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
main{max-width:900px;margin:0 auto;padding:0 14px 20px}
.foot{border-top:1px solid var(--accent)!important;text-align:center;color:var(--muted);font-size:13px;padding:14px 14px 28px;border-top:1px solid var(--line);max-width:900px;margin:0 auto}
.foot b{color:var(--text)}
.btn{border:0;cursor:pointer;background:var(--accent);color:#fff;font-weight:700;padding:10px 14px;border-radius:10px;font-size:14px;text-decoration:none;display:block;text-align:center;font-family:inherit}
#hdr .btn{display:inline-block;padding:8px 12px}
.btn.ghost{background:#1c1c1c;color:var(--text);border:1px solid var(--line)}
.btn.buy{background:linear-gradient(135deg,#ff2b3d,#a50012);box-shadow:0 0 14px var(--glow);letter-spacing:.3px}
.btn.buy:active{transform:scale(.98)}
.btn:disabled{opacity:.6}
.badge{font-size:11px;font-weight:700;background:var(--line);padding:4px 8px;border-radius:6px}
.note{color:var(--muted);text-align:center;font-size:13px;padding:6px 0}
.show{border:2px solid var(--accent);box-shadow:0 0 22px var(--glow);display:grid;grid-template-columns:1.2fr 1fr;background:var(--card);border-radius:16px;overflow:hidden;margin-bottom:18px}
.show img{width:100%;height:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.sinfo{padding:18px;display:flex;flex-direction:column;justify-content:center;gap:8px}
.sinfo h2{margin:0;font-size:26px}
.sinfo p{margin:0;color:var(--muted)}
.tag{align-self:flex-start;background:var(--accent);color:#fff;font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px}
.price{color:var(--price);font-weight:700}
.by{font-size:12px;color:var(--muted)}
.acts{display:flex;flex-direction:column;gap:6px;margin-top:auto}
.dots{display:flex;gap:6px;margin-top:6px}
.dot{width:9px;height:9px;border-radius:50%;border:0;padding:0;background:var(--muted);opacity:.4}
.dot.on{opacity:1;background:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.card{border:2px solid var(--accent);box-shadow:0 0 12px var(--glow);position:relative;background:var(--card);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.card img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--line);cursor:pointer}
.info{padding:10px;display:flex;flex-direction:column;gap:4px;flex:1}
.name{font-weight:700}
.del{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;border:0;background:#000a;color:#fff;cursor:pointer}
.empty{text-align:center;color:var(--muted);padding:60px 16px;border:2px dashed var(--line);border-radius:16px}
.hide{display:none!important}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.overlay{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal{border:1px solid var(--accent);box-shadow:0 0 24px var(--glow);background:var(--card);width:100%;max-width:400px;border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px;max-height:100%;overflow:auto}
.modal h3{margin:0}
.modal label.f{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.modal input[type=text],.modal input[type=email],.modal input[type=password],.modal textarea{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px;width:100%}
.money{display:flex;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding-left:10px;color:var(--text);font-weight:700}
.money input{border:0!important;background:transparent!important;flex:1}
.pick{padding:12px;border:2px dashed var(--accent);color:var(--accent);border-radius:10px;font-weight:700;text-align:center;cursor:pointer;font-size:14px}
.fn{font-size:12px;color:var(--muted);text-align:center}
.row{display:flex;gap:8px}.row .btn{flex:1}
.mem{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.mem span{overflow:hidden;text-overflow:ellipsis}
.mem .btn{padding:6px 10px;font-size:12px;white-space:nowrap}
#prev{max-height:140px;border-radius:8px;object-fit:cover;width:100%}
#vbox{max-width:640px;padding:10px;background:#000}
#vbox video{width:100%;max-height:70vh;border-radius:8px;background:#000}
.vcard{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;position:relative}
.vcard b{font-size:13px;color:var(--accent)}
.vcard p{margin:0;font-size:14px;white-space:pre-wrap;word-break:break-word}
.vcard img{width:100%;max-height:220px;object-fit:cover;border-radius:8px;cursor:pointer}
.vcard small{color:var(--muted);font-size:11px}
.vcard .vdel{position:absolute;top:6px;right:6px;border:0;background:var(--line);color:var(--text);border-radius:6px;font-size:11px;padding:3px 7px;cursor:pointer}
#vList{display:flex;flex-direction:column;gap:8px}
.wide{max-width:520px}
.lg{font-size:12px;padding:7px 0;border-bottom:1px solid var(--line);word-break:break-word}
.lg b{color:var(--accent)}
.lg small{display:block;color:var(--muted)}
.by.click{cursor:pointer;text-decoration:underline}
#slAv{width:90px;height:90px;border-radius:50%;object-fit:cover;border:2px solid var(--accent);align-self:center;background:#222}
.av{width:34px;height:34px;border-radius:50%;object-fit:cover;border:2px solid var(--accent);cursor:pointer;background:#222}
#pPrev{width:90px;height:90px;border-radius:50%;object-fit:cover;border:2px solid var(--accent);align-self:center;background:#222}

/* ===== Messenger style: inbox / chat logs ===== */
#ibList,#clList{display:flex;flex-direction:column}
.cav,.sav{border-radius:50%;object-fit:cover;flex:none;background:#222;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff}
.cav{width:40px;height:40px;font-size:17px}
.sav{width:28px;height:28px;font-size:12px}
.ib{display:flex;align-items:center;gap:12px;text-align:left;width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);color:var(--text);padding:10px 4px;cursor:pointer;font:inherit}
.ib .cav{width:50px;height:50px;font-size:20px}
.ib .ctx{flex:1}
.ib .ctx small{font-size:13px}
.ib .tm{font-size:11px;color:var(--muted);align-self:flex-start;margin-top:4px;flex:none}
.ctx{min-width:0;display:flex;flex-direction:column}
.ctx b{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctx small{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbox{font:inherit;color:var(--text);background:#1c1c1c;border:0;border-radius:20px;padding:10px 14px;width:100%}

/* ===== Messenger style: chat window ===== */
.full{padding:0}
.chatwin{background:var(--card);width:100%;max-width:520px;height:100%;display:flex;flex-direction:column;overflow:hidden}
@media (min-width:560px){.full{padding:16px}.chatwin{height:min(100%,720px);border-radius:16px;border:1px solid var(--accent)}}
.chead{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px 6px;border-bottom:1px solid var(--line);background:#0c0c0c}
.back{border:0;background:transparent;color:var(--accent);font-size:34px;line-height:1;cursor:pointer;padding:0 8px 4px}
#cDisc{background:#1a0a0c;border-bottom:1px solid var(--line);padding:6px 12px;font-size:12px;color:var(--muted);word-break:break-all}
#cDisc a{color:var(--price);font-weight:700}
#msgs{flex:1;overflow:auto;padding:10px 10px 6px;display:flex;flex-direction:column;background:var(--bg)}
.row2{display:flex;align-items:flex-end;gap:6px;margin-top:2px}
.row2.me{justify-content:flex-end}
.row2.first{margin-top:10px}
.sp{width:28px;flex:none}
.b{max-width:75%;padding:8px 13px;border-radius:19px;font-size:15px;white-space:pre-wrap;word-break:break-word;background:#262626}
.row2.me .b{background:var(--accent);color:#fff}
.b a{color:inherit;text-decoration:underline;font-weight:700}
.tsep{align-self:center;color:var(--muted);font-size:11px;margin:12px 0 4px}
.sname{font-size:11px;color:var(--muted)}
.cbar{display:flex;align-items:center;gap:8px;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:#0c0c0c}
.cbar input{flex:1;min-width:0;font:inherit;color:var(--text);background:#1c1c1c;border:0;border-radius:22px;padding:11px 16px}
.ic{width:40px;height:40px;border-radius:50%;border:0;background:transparent;color:var(--accent);font-size:20px;cursor:pointer;flex:none;padding:0}
.ic.send{background:var(--accent);color:#fff}
.ic:disabled{opacity:.5}
.ro{text-align:center;color:var(--muted);font-size:12px;padding:12px;border-top:1px solid var(--line);background:#0c0c0c}
@media (max-width:560px){.show{grid-template-columns:1fr}}
#upAv{width:84px;height:84px;border-radius:50%;object-fit:cover;align-self:center;background:var(--line)}
#tList{display:flex;flex-direction:column;gap:6px;height:50vh;overflow:auto;padding:4px}
.dmsg{max-width:80%;padding:8px 10px;border-radius:12px;font-size:14px;word-break:break-word}
.dmsg.me{align-self:flex-end;background:var(--accent);color:#fff}
.dmsg.them{align-self:flex-start;background:var(--line)}
</style>
</head>
<body>
<header><b>🛒 ValkCSshop - Jher </b><div id="hdr"></div></header>
<main>
  <div class="note" id="note"></div>
  <div class="empty" id="empty">
    <div style="font-size:40px">📦</div>
    <div id="emptyMsg">No products yet. Check back soon!</div>
  </div>

  <section class="show hide" id="show">
    <img id="sImg" alt="">
    <div class="sinfo">
      <span class="tag">⭐ FEATURED</span>
      <h2 id="sName"></h2>
      <p id="sDesc"></p>
      <div class="price" id="sPrice"></div>
      <div class="by" id="sBy"></div>
      <div class="acts" id="sActs"></div>
      <div class="dots" id="dots"></div>
    </div>
  </section>

  <div class="grid" id="grid"></div>
</main>
<footer class="foot">Owner: <b>Jher</b></footer>

<!-- Login / Sign up -->
<div class="overlay hide" id="loginBox">
  <div class="modal">
    <h3 id="lTitle">Login</h3>
    <label class="f">Username<input type="text" id="lUser" autocomplete="username" autocapitalize="none" autocorrect="off"></label>
    <label class="f">Password<input type="password" id="lPass" autocomplete="current-password"></label>
    <label class="f hide" id="lPass2Wrap">Confirm Password<input type="password" id="lPass2" autocomplete="new-password"></label>
    <button class="btn" id="doLogin">Login</button>
    <button class="btn ghost" id="sw1"></button>
    <button class="btn ghost" id="sw2"></button>
    <button class="btn ghost" id="lCancel">Cancel</button>
  </div>
</div>

<!-- Staff list (owner only) -->
<div class="overlay hide" id="staffBox">
  <div class="modal">
    <h3>Users</h3>
    <div id="staffList"></div>
    <button class="btn ghost" id="sClose">Close</button>
  </div>
</div>

<!-- Add product -->
<div class="overlay hide" id="overlay">
  <div class="modal">
    <h3>Add Product</h3>
    <label class="f">Name<input type="text" id="fName" maxlength="40" placeholder="Product name"></label>
    <label class="f">Price (PHP)<div class="money">₱<input type="text" id="fPrice" inputmode="decimal" maxlength="10" placeholder="0.00"></div></label>
    <label class="f">Description<textarea id="fDesc" rows="2" maxlength="120" placeholder="Short description (optional)"></textarea></label>
    <label class="f">Discord link (optional, auto-sent to buyer)<input type="text" id="fDisc" placeholder="https://discord.gg/..." autocapitalize="none" autocorrect="off"></label>
    <label class="f hide" id="fOwnWrap">Product owner username (blank = you)<input type="text" id="fOwn" placeholder="staff username" autocapitalize="none" autocorrect="off"></label>
    <label class="pick" for="fFile">📷 Choose Picture</label>
    <input class="vh" id="fFile" type="file" accept="image/*">
    <img id="prev" class="hide" alt="">
    <label class="pick" for="fVid">🎬 Choose Showcase Video (optional)</label>
    <input class="vh" id="fVid" type="file" accept="video/*">
    <div class="fn" id="vName"></div>
    <div class="row"><button class="btn ghost" id="cancel">Cancel</button><button class="btn" id="save">Save</button></div>
  </div>
</div>

<!-- See vouches (public) -->
<div class="overlay hide" id="vouchBox">
  <div class="modal">
    <h3>✅ Vouched</h3>
    <div id="vList"></div>
    <button class="btn ghost" id="vouchClose">Close</button>
  </div>
</div>

<!-- Add vouch (staff/owner) -->
<div class="overlay hide" id="addVouch">
  <div class="modal">
    <h3>Add Vouch</h3>
    <label class="f">Vouch message<textarea id="vMsg" rows="3" maxlength="300" placeholder="e.g. Legit buyer, smooth transaction!"></textarea></label>
    <label class="pick" for="vFile">📷 Add Proof Picture (optional)</label>
    <input class="vh" id="vFile" type="file" accept="image/*">
    <img id="vPrev" class="hide" alt="" style="max-height:140px;border-radius:8px;object-fit:cover;width:100%">
    <div class="row"><button class="btn ghost" id="vCancel">Cancel</button><button class="btn" id="vSave">Post Vouch</button></div>
  </div>
</div>

<!-- Video player -->
<div class="overlay hide" id="vOverlay">
  <div class="modal" id="vbox">
    <video id="player" controls playsinline></video>
    <button class="btn ghost" id="vClose">Close</button>
  </div>
</div>
<input class="vh" id="aFile" type="file" accept="video/*">

<!-- Inbox (MY chats only) -->
<div class="overlay hide" id="inboxBox">
  <div class="modal wide">
    <h3>💬 Messages</h3>
    <div id="ibList"></div>
    <button class="btn ghost" id="ibClose">Close</button>
  </div>
</div>

<!-- Chat Logs (owner only, ALL chats, view only) -->
<div class="overlay hide" id="clBox">
  <div class="modal wide">
    <h3>🗂 Chat Logs</h3>
    <input class="sbox" id="clSearch" placeholder="Search buyer / seller / product" autocapitalize="none" autocorrect="off">
    <div id="clList"></div>
    <button class="btn ghost" id="clClose">Close</button>
  </div>
</div>

<!-- Chat (Messenger style) -->
<div class="overlay full hide" id="chatBox">
  <div class="chatwin">
    <div class="chead">
      <button class="back" id="cClose" aria-label="Back">‹</button>
      <span id="cAv" style="display:contents"></span>
      <div class="ctx"><b id="cTitle">Chat</b><small id="cSub"></small></div>
    </div>
    <div id="cDisc" class="hide"></div>
    <div id="msgs"></div>
    <div class="cbar" id="cbar">
      <button class="ic" id="cAtt" title="Send photo/video">📎</button>
      <input type="text" id="cInput" maxlength="500" placeholder="Aa" autocomplete="off">
      <button class="ic send" id="cSend" aria-label="Send">➤</button>
    </div>
    <div class="ro hide" id="cRo">👁 View only (Chat Logs)</div>
    <input class="vh" id="cMedia" type="file" accept="image/*,video/*">
  </div>
</div>

<!-- Edit product -->
<div class="overlay hide" id="editBox">
  <div class="modal">
    <h3 id="eTitle">Edit Product</h3>
    <label class="f">Discord link (auto-sent to buyer)<input type="text" id="eDisc" placeholder="https://discord.gg/..." autocapitalize="none" autocorrect="off"></label>
    <label class="f hide" id="eOwnWrap">Product owner username<input type="text" id="eOwn" placeholder="staff username" autocapitalize="none" autocorrect="off"></label>
    <div class="row"><button class="btn ghost" id="eCancel">Cancel</button><button class="btn" id="eSave">Save</button></div>
  </div>
</div>

<!-- Seller profile -->
<div class="overlay hide" id="slBox">
  <div class="modal">
    <img id="slAv" alt="">
    <h3 id="slNm" style="text-align:center"></h3>
    <div class="fn" id="slRole"></div>
    <p id="slBio" style="margin:0;text-align:center;color:var(--muted);white-space:pre-wrap"></p>
    <div id="slId" style="font-size:12px;opacity:.7;word-break:break-all"></div>
    <button class="btn ghost" id="slClose">Close</button>
  </div>
</div>

<!-- Profile -->
<div class="overlay hide" id="profBox">
  <div class="modal">
    <h3>👤 My Profile</h3>
    <img id="pPrev" alt="">
    <label class="pick" for="pFile">📷 Change Picture</label>
    <input class="vh" id="pFile" type="file" accept="image/*">
    <label class="f">Or paste picture link (optional)<input type="text" id="pUrl" placeholder="https://..." autocapitalize="none" autocorrect="off"></label>
    <div class="fn" id="pUser"></div>
    <div id="pId" style="font-size:12px;opacity:.7;word-break:break-all;margin-top:4px;cursor:pointer" title="Tap to copy"></div>
    <label class="f">Display name<input type="text" id="pName" maxlength="24" placeholder="Display name"></label>
    <label class="f">Bio<textarea id="pBio" rows="3" maxlength="160" placeholder="About you (optional)"></textarea></label>
    <label class="f">New password (leave blank to keep)<input type="password" id="pPass" autocomplete="new-password"></label>
    <div class="row"><button class="btn ghost" id="pCancel">Cancel</button><button class="btn" id="pSave">Save</button></div>
  </div>
</div>
  
<!-- Search users -->
<div class="overlay hide" id="searchBox">
  <div class="modal">
    <h3>🔍 Search Users</h3>
    <input type="text" id="uQ" placeholder="Type a username..." autocapitalize="none" autocorrect="off" style="font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px;width:100%">
    <div id="uList"></div>
    <button class="btn ghost" id="searchClose">Close</button>
  </div>
</div>

<!-- User profile (view) -->
<div class="overlay hide" id="userBox">
  <div class="modal">
    <img id="upAv" alt="">
    <h3 id="upName" style="text-align:center;margin:0"></h3>
    <div style="text-align:center"><span class="badge" id="upRole"></span> <span class="fn" id="upCount"></span></div>
    <p id="upBio" style="margin:0;text-align:center;color:var(--muted);white-space:pre-wrap"></p>
    <div id="upActs" class="acts" style="margin-top:0"></div>
    <div id="upVouches" style="display:flex;flex-direction:column;gap:8px"></div>
    <button class="btn ghost" id="upBack">Back</button>
  </div>
</div>

<!-- DM chats list -->
<div class="overlay hide" id="dmListBox">
  <div class="modal">
    <h3>💬 Chats</h3>
    <div id="cList"></div>
    <button class="btn ghost" id="chatsClose">Close</button>
  </div>
</div>

<!-- DM thread -->
<div class="overlay hide" id="threadBox">
  <div class="modal">
    <h3 id="tName"></h3>
    <div id="tList"></div>
    <textarea id="tMsg" rows="2" maxlength="500" placeholder="Type a message..." style="font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px;width:100%"></textarea>
    <div class="row"><button class="btn ghost" id="tClose">Close</button><button class="btn" id="tSend">Send</button></div>
  </div>
</div>
  
<!-- Activity Logs (owner only) -->
<div class="overlay hide" id="logBox">
  <div class="modal wide">
    <h3>📜 Activity Logs</h3>
    <div id="logList"></div>
    <div class="row"><button class="btn ghost" id="logRefresh">Refresh</button><button class="btn ghost" id="logClose">Close</button></div>
  </div>
</div>

  `<svg xmlns="http://www.w3.org/2000/svg" width="600" height="450"><defs><linearGradient id="g"><stop offset="0" stop-color="hsl(${h},70%,45%)"/><stop offset="1" stop-color="hsl(${h+60},70%,30%)"/></linearGradient></defs><rect width="600" height="450" fill="url(#g)"/><text x="300" y="235" font-size="48" font-family="sans-serif" fill="#fff" text-anchor="middle">${t.replace(/[<>&]/g, "")}</text></svg>`);

const safeFetch = (url, opts = {}) => {
  if (opts.headers && typeof opts.headers.forEach === "function" && !(opts.headers.constructor === Object)) {
    const o = {}; opts.headers.forEach((v, k) => { o[k] = v; }); opts = { ...opts, headers: o };
  }
  return fetch(url, opts);
};

/* ---------- auth + header ---------- */
async function refreshAuth() {
  const { data: { session } } = await sb.auth.getSession();
  me = session ? session.user : null; role = null; prof = null;
  let created = false;
  if (me) {
    let { data } = await sb.from("profiles").select("*").eq("id", me.id).maybeSingle();
    if (!data) {
      const want = (me.user_metadata && me.user_metadata.want) === "staff" ? "pending" : "buyer";
      await sb.from("profiles").insert({ id: me.id, email: me.email, role: want });
      ({ data } = await sb.from("profiles").select("*").eq("id", me.id).maybeSingle());
      created = true;
    }
    role = data ? data.role : "buyer"; prof = data;
    if (loggedFor !== me.id) {
      loggedFor = me.id;
      log(created ? "Created account" : "Logged in", created ? "role: " + role : "");
    }
  } else { loggedFor = null; }
  renderHeader(); render();
}

/* ---------- upload helper ---------- */
async function upload(blob, folder, ext, type) {
  const path = `${folder}/${crypto.randomUUID()}.${ext}`;
  const { error } = await sb.storage.from("media").upload(path, blob, { contentType: type, upsert: false });
  if (error) throw error;
  return sb.storage.from("media").getPublicUrl(path).data.publicUrl;
}
const extOf = f => (f.name.split(".").pop() || "mp4").toLowerCase().replace(/[^a-z0-9]/g, "") || "mp4";

function shrink(file, cb) {
  const r = new FileReader();
  r.onload = () => {
    const im = new Image();
    im.onload = () => {
      const k = Math.min(1, 1000 / Math.max(im.width, im.height));
      const cv = document.createElement("canvas"); cv.width = im.width * k; cv.height = im.height * k;
      cv.getContext("2d").drawImage(im, 0, 0, cv.width, cv.height);
      cv.toBlob(cb, "image/jpeg", 0.85);
    };
    im.src = r.result;
  };
  r.readAsDataURL(file);
}
$("fFile").onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  shrink(f, b => { pendingImg = b; $("prev").src = URL.createObjectURL(b); $("prev").classList.remove("hide"); });
};

const PROFS = {};
const colorFor = n => { let h = 0; for (const ch of String(n || "?")) h = (h * 31 + ch.charCodeAt(0)) % 360; return h; };

  const t = new Date(d), n = new Date();
  if (t.toDateString() === n.toDateString()) return t.toLocaleTimeString("en-PH", { hour: "numeric", minute: "2-digit" });

/* ---------- BUY -> chat with the product's seller ---------- */
async function buy(p) {
  if (!me) { setMode("buyer"); $("loginBox").classList.remove("hide"); return; }
  if (role === "pending") { alert("Hinihintay pa ang approval ng account mo."); return; }
  if (!p.seller_id) { alert("Walang seller ang product na ito."); return; }
  if (p.seller_id === me.id) { alert("Ikaw ang seller ng product na ito. Tingnan ang 💬 Messages para sa mga buyer."); return; }
  let { data: c, error } = await sb.from("conversations").select("*").eq("product_id", p.id).eq("buyer_id", me.id).maybeSingle();
  if (error) { alert(error.message); return; }
  if (!c) {
    const r = await sb.from("conversations").insert({
      product_id: p.id, product_name: p.name, buyer_id: me.id, buyer_name: myName(),
      seller_id: p.seller_id, seller_name: sellerName(p)
    }).select().single();
    if (r.error) { alert(r.error.message); return; }
    c = r.data;
    log("Started chat", "buyer " + myName() + " -> seller " + c.seller_name + " re: " + p.name);
  }
  openChat(c, null);
}

/* ---------- conversations list (shared by Messages + Chat Logs) ---------- */
async function fetchConvos(onlyMine) {
  let q = sb.from("conversations").select("*");
  if (onlyMine) q = q.or("buyer_id.eq." + me.id + ",seller_id.eq." + me.id);
  const { data, error } = await q.order("created_at", { ascending: false });
  if (error) throw error;
  const last = {};
  if (data.length) {
    const r = await sb.from("messages").select("convo_id,body,created_at,sender_id")
      .in("convo_id", data.map(c => c.id)).order("created_at", { ascending: false }).limit(500);
    (r.data || []).forEach(m => { if (!last[m.convo_id]) last[m.convo_id] = m; });
  }
  await loadProfs(data.flatMap(c => [c.buyer_id, c.seller_id]));
  data.forEach(c => c._last = last[c.id] || null);
  data.sort((a, b) => new Date((b._last || b).created_at) - new Date((a._last || a).created_at));
  return data;
}
function preview(c, logMode) {
  const m = c._last; if (!m) return "No messages yet";
  const t = String(m.body || "").trim();
  const txt = isImgUrl(t) ? "📷 Photo" : isVidUrl(t) ? "🎬 Video" : t;
  return (!logMode && m.sender_id === me.id ? "You: " : "") + txt;
}
function convoItem(c, logMode) {
  const mineBuyer = me.id === c.buyer_id;
  const otherId = logMode ? c.buyer_id : (mineBuyer ? c.seller_id : c.buyer_id);
  const otherName = logMode ? c.buyer_name : (mineBuyer ? c.seller_name : c.buyer_name);
  const p = profOf(otherId);
  const b = document.createElement("button"); b.className = "ib";
  b.append(avEl(p && p.avatar_url, otherName, "cav"));
  const x = document.createElement("div"); x.className = "ctx";
  const t = document.createElement("b"); t.textContent = logMode ? c.buyer_name + " ↔ " + c.seller_name : otherName;
  const sm = document.createElement("small"); sm.textContent = (c.product_name || "Product") + " · " + preview(c, logMode);
  x.append(t, sm);
  const tm = document.createElement("span"); tm.className = "tm"; tm.textContent = shortTime((c._last || c).created_at);
  b.append(x, tm);
  b.onclick = () => openChat(c, logMode ? "log" : "inbox");
  return b;
}

/* ---------- Messages (MY chats only, even for owner) ---------- */
async function openInbox() {
  $("inboxBox").classList.remove("hide");
  const list = $("ibList"); list.textContent = "Loading...";
  try {
    const data = await fetchConvos(true);
    list.replaceChildren();
    if (!data.length) { list.textContent = "No chats yet. Tap BUY on a product to message its seller."; return; }
    data.forEach(c => list.append(convoItem(c, false)));
  } catch (e) { list.textContent = e.message || String(e); }
}
$("ibClose").onclick = () => $("inboxBox").classList.add("hide");

/* ---------- Chat Logs (owner only: ALL chats, view only) ---------- */
let CL = [];
async function openChatLogs() {
  if (role !== "owner") return;
  $("clBox").classList.remove("hide"); $("clSearch").value = "";
  const list = $("clList"); list.textContent = "Loading...";
  try { CL = await fetchConvos(false); drawCL(); } catch (e) { list.textContent = e.message || String(e); }
}
function drawCL() {
  const q = $("clSearch").value.trim().toLowerCase();
  const list = $("clList"); list.replaceChildren();
  const rows = CL.filter(c => !q || [c.buyer_name, c.seller_name, c.product_name].join(" ").toLowerCase().includes(q));
  if (!rows.length) { list.textContent = "Walang chat."; return; }
  rows.forEach(c => list.append(convoItem(c, true)));
}
$("clSearch").oninput = drawCL;
$("clClose").onclick = () => $("clBox").classList.add("hide");

/* ---------- chat window (Messenger style, refreshes every 4s) ---------- */
function linkify(el, text) {
  const t = String(text || "").trim();
  if (isImgUrl(t)) {
    const im = document.createElement("img");
    im.src = t; im.alt = "photo";
    im.style.cssText = "display:block;width:220px;max-width:100%;border-radius:14px;cursor:pointer";
    im.onclick = () => window.open(t, "_blank");
    el.style.padding = "4px"; el.append(im); return;
  }
  if (isVidUrl(t)) {
    const v = document.createElement("video");
    v.src = t; v.controls = true; v.playsInline = true; v.preload = "metadata";
    v.style.cssText = "display:block;width:220px;max-width:100%;border-radius:14px;background:#000";
    el.style.padding = "4px"; el.append(v); return;
  }
  String(text || "").split(/(https?:\/\/[^\s]+)/g).forEach(part => {
    if (/^https?:\/\//.test(part)) {
      const a = document.createElement("a");
      a.href = part; a.textContent = part; a.target = "_blank"; a.rel = "noopener noreferrer";
      el.append(a);
    } else if (part) el.append(document.createTextNode(part));
  });
}
let curConvo = null, poll = null, lastKey = "", cameFrom = null, curMember = false;
function setHead() {
  const c = curConvo; if (!c) return;
  const mineBuyer = me.id === c.buyer_id;
  const otherId = !curMember ? c.buyer_id : (mineBuyer ? c.seller_id : c.buyer_id);
  const otherName = !curMember ? c.buyer_name + " ↔ " + c.seller_name : (mineBuyer ? c.seller_name : c.buyer_name);
  const p = profOf(otherId);
  $("cAv").replaceChildren(avEl(p && p.avatar_url, otherName, "cav"));
  $("cTitle").textContent = otherName;
  $("cSub").textContent = "🛒 " + (c.product_name || "Product");
}
function openChat(c, from) {
  curConvo = c; lastKey = ""; cameFrom = from || null;
  $("inboxBox").classList.add("hide"); $("clBox").classList.add("hide");
  curMember = me.id === c.buyer_id || me.id === c.seller_id;
  setHead();
  const disc = $("cDisc"), pr = PRODUCTS.find(x => x.id === c.product_id);
  if (curMember && pr && pr.discord_link && /^https:\/\//i.test(pr.discord_link)) {
    const a = document.createElement("a");
    a.href = pr.discord_link; a.textContent = pr.discord_link; a.target = "_blank"; a.rel = "noopener noreferrer";
    disc.replaceChildren(document.createTextNode("Discord: "), a); disc.classList.remove("hide");
  } else disc.classList.add("hide");
  $("cbar").classList.toggle("hide", !curMember);
  $("cRo").classList.toggle("hide", curMember);
  $("msgs").replaceChildren();
  $("chatBox").classList.remove("hide");
  clearInterval(poll); poll = setInterval(loadMsgs, 4000);
  loadProfs([c.buyer_id, c.seller_id]).then(() => { if (curConvo === c) { setHead(); lastKey = ""; loadMsgs(); } });
  loadMsgs();
  if (curMember) $("cInput").focus();
}
$("cClose").onclick = () => {
  clearInterval(poll); poll = null;
  $("chatBox").classList.add("hide");
  const f = cameFrom; curConvo = null;
  if (f === "inbox") openInbox(); else if (f === "log") openChatLogs();
};
async function loadMsgs() {
  const c = curConvo; if (!c) return;
  const { data, error } = await sb.from("messages").select("*").eq("convo_id", c.id).order("created_at");
  if (c !== curConvo || error || !data) return;
  const key = data.length + ":" + (data.length ? data[data.length - 1].id : "");
  if (key === lastKey) return;
  const first = lastKey === ""; lastKey = key;
  const box = $("msgs");
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
  box.replaceChildren();
  if (!data.length) { const n = document.createElement("div"); n.className = "tsep"; n.textContent = "Say hi 👋"; box.append(n); }
  const GAP = 30 * 60000;
  let prev = null;
  data.forEach((m, i) => {
    const mine = curMember ? m.sender_id === me.id : m.sender_id === c.buyer_id;
    const gap = !prev || new Date(m.created_at) - new Date(prev.created_at) > GAP;
    if (gap) {
      const ts = document.createElement("div"); ts.className = "tsep";
      ts.textContent = new Date(m.created_at).toLocaleString("en-PH", { hour: "numeric", minute: "2-digit", month: "short", day: "numeric" });
      box.append(ts);
    }
    const newGroup = gap || prev.sender_id !== m.sender_id;
    const next = data[i + 1];
    const lastInGroup = !next || next.sender_id !== m.sender_id || new Date(next.created_at) - new Date(m.created_at) > GAP;
    if (!curMember && newGroup) {
      const sn = document.createElement("div"); sn.className = "sname"; sn.textContent = m.sender_name;
      sn.style.alignSelf = mine ? "flex-end" : "flex-start";
      sn.style.margin = mine ? "8px 6px 2px 0" : "8px 0 2px 34px";
      box.append(sn);
    }
    const r = document.createElement("div"); r.className = "row2" + (mine ? " me" : "") + (newGroup && curMember ? " first" : "");
    if (!mine) {
      if (lastInGroup) { const p = profOf(m.sender_id); r.append(avEl(p && p.avatar_url, m.sender_name, "sav")); }
      else { const sp = document.createElement("div"); sp.className = "sp"; r.append(sp); }
    }
    const b = document.createElement("div"); b.className = "b";
    linkify(b, m.body);
    b.title = new Date(m.created_at).toLocaleString("en-PH");
    r.append(b); box.append(r); prev = m;
  });
  if (first || atBottom) box.scrollTop = box.scrollHeight;
}
async function sendRaw(body) {
  const { error } = await sb.from("messages").insert({ convo_id: curConvo.id, sender_id: me.id, sender_name: myName(), body });
  if (error) throw error;
  await loadMsgs();
}
async function sendMsg() {
  const body = $("cInput").value.trim(); if (!body || !curConvo || !curMember) return;
  const c = curConvo;
  $("cInput").value = "";
  try {
    await sendRaw(body);
    log("Sent message", myName() + " -> " + (me.id === c.buyer_id ? c.seller_name : c.buyer_name) + " re: " + c.product_name + ": " + body.slice(0, 80));
  } catch (e) { alert(e.message || e); $("cInput").value = body; }
  $("cInput").focus();
}
$("cSend").onclick = sendMsg;
$("cInput").onkeydown = e => { if (e.key === "Enter") sendMsg(); };
$("cAtt").onclick = () => { $("cMedia").value = ""; $("cMedia").click(); };
$("cMedia").onchange = async e => {
  const f = e.target.files[0]; if (!f || !curConvo || !curMember) return;
  const isImg = f.type.startsWith("image/"), isVid = f.type.startsWith("video/");
  if (!isImg && !isVid) { alert("Photo o video lang."); return; }
  if (isVid && f.size > MAX_VIDEO_MB * 1048576) { alert("Video too big. Max " + MAX_VIDEO_MB + "MB."); return; }
  const btn = $("cAtt"); btn.disabled = true; btn.textContent = "⏳";
  try {
    let url;
    if (isImg) {
      const blob = await new Promise(res => shrink(f, res));
      url = await upload(blob, "chat", "jpg", "image/jpeg");
    } else url = await upload(f, "chat", extOf(f), f.type);
    await sendRaw(url);
    log("Sent " + (isImg ? "photo" : "video"), myName() + " re: " + curConvo.product_name);
  } catch (err) { alert("Error: " + (err.message || err)); }
  btn.disabled = false; btn.textContent = "📎";
};

/* ---------- Activity logs (owner only) ---------- */
async function openLogs() {
  if (role !== "owner") return;
  $("logBox").classList.remove("hide");
  const list = $("logList"); list.textContent = "Loading...";
  const { data, error } = await sb.from("activity_logs").select("*").order("created_at", { ascending: false }).limit(150);
  if (error) { list.textContent = error.message; return; }
  list.replaceChildren();
  if (!data.length) { list.textContent = "No logs yet."; return; }
  data.forEach(l => {
    const d = document.createElement("div"); d.className = "lg";
    const b = document.createElement("b"); b.textContent = l.username || "user";
    d.append(b, document.createTextNode(" (" + (l.role || "") + ") " + (l.action || "")));
    if (l.details) { const sm = document.createElement("small"); sm.textContent = l.details; d.append(sm); }
    const tm = document.createElement("small"); tm.textContent = new Date(l.created_at).toLocaleString("en-PH");
    d.append(tm); list.append(d);
  });
}
$("logRefresh").onclick = openLogs;
$("logClose").onclick = () => $("logBox").classList.add("hide");

/* ---------- sellers / owner assignment / discord ---------- */
async function loadSellers() {
  const { data } = await sb.from("profiles").select("id,email,display_name,bio,avatar_url,role").in("role", ["staff", "owner"]);
  SELLERS = {}; (data || []).forEach(x => SELLERS[x.id] = x);
}
function sellerName(p) { const x = SELLERS[p.seller_id]; return x ? (x.display_name || uname(x.email)) : (p.seller_name || "shop"); }
function sellerUser(p) { const x = SELLERS[p.seller_id]; return x ? uname(x.email) : ""; }
const normDisc = v => { v = (v || "").trim(); if (!v) return ""; return /^https?:\/\//i.test(v) ? v : "https://" + v; };
const validDisc = v => !v || /^https:\/\/(www\.)?(discord\.gg|discord(app)?\.com\/invite)\/[A-Za-z0-9_-]+\/?$/i.test(v);
async function resolveOwner(u) {
  u = (u || "").trim().toLowerCase().replace(/\s+/g, "");
  if (!u) return { id: me.id, name: myName() };
  const { data, error } = await sb.from("profiles").select("id,email,display_name,role").eq("email", u + "@" + LOGIN_DOMAIN).maybeSingle();
  if (error) throw error;
  if (!data || !["staff", "owner"].includes(data.role)) throw new Error("Walang staff na may username na '" + u + "'.");
  return { id: data.id, name: data.display_name || uname(data.email) };
}

/* ---------- edit product ---------- */
let editing = null;
function openEdit(p) {
  editing = p;
  $("eTitle").textContent = "Edit: " + p.name;
  $("eDisc").value = p.discord_link || "";
  $("eOwn").value = "";
  $("eOwnWrap").classList.toggle("hide", role !== "owner");
  $("editBox").classList.remove("hide");
}
$("eCancel").onclick = () => $("editBox").classList.add("hide");
$("eSave").onclick = async () => {
  if (!editing) return;
  const disc = normDisc($("eDisc").value);
  if (!validDisc(disc)) { alert("Discord link must look like https://discord.gg/xxxx or https://discord.com/invite/xxxx"); return; }
  const btn = $("eSave"); btn.disabled = true;
  try {
    const upd = { discord_link: disc || null };
    if (role === "owner" && $("eOwn").value.trim()) {
      const own = await resolveOwner($("eOwn").value);
      upd.seller_id = own.id; upd.seller_name = own.name;
    }
    const { error } = await sb.from("products").update(upd).eq("id", editing.id);
    if (error) throw error;
    log("Edited product", editing.name + (upd.seller_name ? " -> owner " + upd.seller_name : "") + (disc ? " (discord set)" : ""));
    $("editBox").classList.add("hide");
    await loadProducts();
  } catch (err) { alert("Error: " + (err.message || err)); }
  btn.disabled = false;
};

/* ---------- seller profile ---------- */
function openSeller(p) {
  const x = SELLERS[p.seller_id];
  $("slAv").src = (x && x.avatar_url) || ph(sellerName(p).slice(0, 8), 0);
  $("slNm").textContent = sellerName(p);
  $("slRole").textContent = x ? "@" + uname(x.email) + " · " + x.role : "";
  $("slBio").textContent = (x && x.bio) || "";
  $("slId").textContent = "User ID: " + p.seller_id;
  $("slBox").classList.remove("hide");
}
$("slClose").onclick = () => $("slBox").classList.add("hide");

/* ---------- my profile ---------- */
let pendingAvatar = null;
function openProfile() {
  pendingAvatar = null; $("pFile").value = ""; $("pUrl").value = "";
  $("pPrev").src = (prof && prof.avatar_url) || ph(uname(me.email).slice(0, 8), 0);
  $("pUser").textContent = "Username: " + uname(me.email) + " · " + role;
  $("pId").textContent = "User ID: " + me.id;
  $("pId").onclick = () => {
    navigator.clipboard.writeText(me.id)
      .then(() => alert("User ID copied!"))
      .catch(() => {});
  };
  $("pName").value = (prof && prof.display_name) || "";
  $("pBio").value = (prof && prof.bio) || "";
  $("pPass").value = "";
  $("profBox").classList.remove("hide");
}
$("pCancel").onclick = () => $("profBox").classList.add("hide");
$("pFile").onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  shrink(f, b => { pendingAvatar = b; $("pUrl").value = ""; $("pPrev").src = URL.createObjectURL(b); });
};
$("pUrl").oninput = () => { const v = $("pUrl").value.trim(); if (/^https?:\/\/\S+$/i.test(v)) { pendingAvatar = null; $("pPrev").src = v; } };
$("pSave").onclick = async () => {
  const btn = $("pSave");
  const np = $("pPass").value;
  if (np && np.length < 6) { alert("Password must be at least 6 characters."); return; }
  const link = $("pUrl").value.trim();
  if (link && !/^https?:\/\/\S+$/i.test(link)) { alert("Ang picture link dapat nagsisimula sa https://"); return; }
  btn.disabled = true; btn.textContent = "Saving...";
  try {
    const upd = { display_name: $("pName").value.trim() || null, bio: $("pBio").value.trim() || null };
    if (pendingAvatar) {
      try { upd.avatar_url = await upload(pendingAvatar, "avatar", "jpg", "image/jpeg"); }
      catch (e) { throw new Error("Hindi na-upload ang picture (" + (e.message || e) + "). Subukan mong i-paste na lang ang link sa 'paste picture link'."); }
    } else if (link) upd.avatar_url = link;
    const { data: rows, error } = await sb.from("profiles").update(upd).eq("id", me.id).select("id");
    if (error) throw error;
    if (!rows || !rows.length) throw new Error("Hindi na-save ang profile (walang permission sa profiles table — check ang UPDATE policy sa Supabase).");
    if (np) { const r = await sb.auth.updateUser({ password: np }); if (r.error) throw r.error; }
    log("Updated profile", upd.display_name || "");
    if (role === "staff" || role === "owner") { await sb.from("products").update({ seller_name: upd.display_name || uname(me.email) }).eq("seller_id", me.id); loadProducts(); }
    delete PROFS[me.id];
    $("profBox").classList.add("hide");
    await refreshAuth();
  } catch (err) { alert("Error: " + (err.message || err)); }
  finally { btn.disabled = false; btn.textContent = "Save"; }
};
/* ---------- search users + profile + DM ---------- */
const roleLabel = r => r === "owner" ? "Owner" : r === "staff" ? "Staff" : "Buyer";
const dispName = u => u.display_name || u.username;
function openSearch() { $("searchBox").classList.remove("hide"); $("uQ").value = ""; runSearch(); $("uQ").focus(); }
async function runSearch() {
  const q = $("uQ").value.trim().replace(/[%,]/g, "");
  const list = $("uList"); list.textContent = "Searching...";
  let query = sb.from("public_profiles").select("*").order("username").limit(20);
  if (q) query = query.or(`username.ilike.%${q}%,display_name.ilike.%${q}%`);
  const { data, error } = await query;
  if (error) { list.textContent = error.message; return; }
  list.replaceChildren();
  if (!data.length) { list.textContent = "No users found."; return; }
  data.forEach(u => {
    const r = document.createElement("div"); r.className = "mem";
    const t = document.createElement("span"); t.textContent = dispName(u) + " · " + roleLabel(u.role);
    r.append(t, mk("View", "btn", () => openUserProfile(u)));
    list.append(r);
  });
}
let sTimer;
$("uQ").oninput = () => { clearTimeout(sTimer); sTimer = setTimeout(runSearch, 300); };
$("searchClose").onclick = () => $("searchBox").classList.add("hide");

async function openUserProfile(u) {
  $("searchBox").classList.add("hide"); $("userBox").classList.remove("hide");
  $("upAv").src = u.avatar_url || ph(u.username.slice(0, 8), 0);
  $("upName").textContent = dispName(u);
  $("upRole").textContent = "@" + u.username + " · " + roleLabel(u.role);
  $("upBio").textContent = u.bio || "";
  const acts = $("upActs"); acts.replaceChildren();
  if (me && me.id !== u.id) acts.append(mk("💬 Message", "btn", () => { $("userBox").classList.add("hide"); openThread(u); }));
  else if (!me) { const n = document.createElement("div"); n.className = "fn"; n.textContent = "Login to message this user."; acts.append(n); }
  const list = $("upVouches"); list.textContent = "Loading...";
  const { data } = await sb.from("vouches").select("*").eq("user_id", u.id).order("created_at", { ascending: false });
  const v = data || [];
  $("upCount").textContent = v.length + " vouch" + (v.length === 1 ? "" : "es") + " posted";
  list.replaceChildren();
  v.forEach(x => {
    const c = document.createElement("div"); c.className = "vcard";
    const m = document.createElement("p"); m.textContent = x.message;
    const d = document.createElement("small"); d.textContent = new Date(x.created_at).toLocaleString("en-PH");
    c.append(m, d); list.append(c);
  });
}
$("upBack").onclick = () => { $("userBox").classList.add("hide"); $("searchBox").classList.remove("hide"); };

let peer = null, threadTimer = null;
async function openChats() {
  if (!me) return;
  $("dmListBox").classList.remove("hide");
  const list = $("cList"); list.textContent = "Loading...";
  const { data, error } = await sb.from("dm_messages").select("*").order("created_at", { ascending: false }).limit(200);
  if (error) { list.textContent = error.message; return; }
  const last = new Map();
  data.forEach(m => { const pid = m.sender_id === me.id ? m.receiver_id : m.sender_id; if (!last.has(pid)) last.set(pid, m); });
  if (!last.size) { list.textContent = "No chats yet. Use 🔍 Users to start one."; return; }
  const { data: us } = await sb.from("public_profiles").select("*").in("id", [...last.keys()]);
  list.replaceChildren();
  (us || []).forEach(u => {
    const r = document.createElement("div"); r.className = "mem";
    const t = document.createElement("span"); t.textContent = dispName(u) + ": " + last.get(u.id).body;
    r.append(t, mk("Open", "btn", () => { $("dmListBox").classList.add("hide"); openThread(u); }));
    list.append(r);
  });
}
$("chatsClose").onclick = () => $("dmListBox").classList.add("hide");

function openThread(u) {
  if (!me) { alert("Login first to message."); return; }
  peer = u; $("tName").textContent = "💬 " + dispName(u); $("tList").replaceChildren(); $("tMsg").value = "";
  $("threadBox").classList.remove("hide");
  loadThread(true); clearInterval(threadTimer); threadTimer = setInterval(() => loadThread(false), 4000);
}
async function loadThread(first) {
  if (!me || !peer) return;
  const { data, error } = await sb.from("dm_messages").select("*")
    .or(`and(sender_id.eq.${me.id},receiver_id.eq.${peer.id}),and(sender_id.eq.${peer.id},receiver_id.eq.${me.id})`)
    .order("created_at").limit(200);
  if (error) return;
  const box = $("tList");
  const atBottom = first || box.scrollHeight - box.scrollTop - box.clientHeight < 60;
  box.replaceChildren();
  data.forEach(m => {
    const d = document.createElement("div");
    d.className = "dmsg " + (m.sender_id === me.id ? "me" : "them"); d.textContent = m.body;
    box.append(d);
  });
  if (atBottom) box.scrollTop = box.scrollHeight;
}
$("tSend").onclick = async () => {
  const body = $("tMsg").value.trim(); if (!body || !peer) return;
  $("tSend").disabled = true;
  const { error } = await sb.from("dm_messages").insert({ sender_id: me.id, receiver_id: peer.id, body });
  $("tSend").disabled = false;
  if (error) { alert(error.message); return; }
  $("tMsg").value = ""; loadThread(true);
};
$("tClose").onclick = () => { clearInterval(threadTimer); peer = null; $("threadBox").classList.add("hide"); };
setMode("login");
renderHeader(); render(); loadProducts(); refreshAuth();
</script>
